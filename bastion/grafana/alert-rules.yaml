apiVersion: 1
groups:
  - orgId: 1
    name: llm-node
    folder: Monitoring
    interval: 1m
    rules:
      - uid: bg38020xacqo0c
        title: llm-ec2-high-cpu
        annotations:
          description: "Використання CPU на LLM EC2 перевищує 80% протягом 5 хвилин."
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="llm-node",mode="idle"}[5m])))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        notification_settings:
          receiver: llm-email
      - uid: eg380d2v9iepsf
        title: llm-ec2-high-memory
        annotations:
          description: "Використання пам'яті на LLM EC2 перевищує 80% протягом 5 хвилин."
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: 100 * (1 - node_memory_MemAvailable_bytes{job="llm-node"} / node_memory_MemTotal_bytes{job="llm-node"})
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        notification_settings:
          receiver: llm-email
